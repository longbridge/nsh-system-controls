name: Release

# Publishes nsh-system-controls to crates.io.
#
# - Pushing a tag `vX.Y.Z` that matches `version` in Cargo.toml publishes
#   that version.
# - Running it by hand publishes the given tag; a dry run packages and
#   verifies the crate without uploading.
#
# A version already on crates.io is skipped, so running it again is safe.
# Needs the `CARGO_REGISTRY_TOKEN` secret.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.1)"
        required: true
        type: string
      dry-run:
        description: "Package and verify only, upload nothing"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}
  DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::Tag $TAG does not match version $version in Cargo.toml"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Skip a version already on crates.io
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -A "longbridge/nsh-system-controls release workflow" \
            "https://crates.io/api/v1/crates/nsh-system-controls/$VERSION")
          if [[ "$status" == "200" ]]; then
            echo "::notice::nsh-system-controls $VERSION is already on crates.io"
            echo "PUBLISHED=1" >> "$GITHUB_ENV"
          fi

      - uses: Swatinem/rust-cache@v2

      - name: Publish
        if: env.PUBLISHED != '1' || env.DRY_RUN != ''
        run: cargo publish --locked $DRY_RUN
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
